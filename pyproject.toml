[project]
name = "facevector-core"
version = "1.0.0"
description = "High-performance face recognition API with GPU acceleration"
readme = "README.md"
requires-python = ">=3.10, <3.14"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "onnxruntime-gpu>=1.16.0",
    "opencv-python>=4.8.1",
    "numpy>=1.24.0",
    "pillow>=10.1.0",
    "supabase>=2.0.0",
    "pyjwt>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = []
