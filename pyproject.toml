[project]
name = "facevector-core"
version = "1.0.0"
description = "High-performance face recognition API"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12, <3.14"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0,<2.0.0",
    "pillow>=12.3.0",
    "qdrant-client>=1.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.18.0",
]
gpu = [
    "onnxruntime-gpu>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest-cov>=5.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.91",
]

[tool.coverage.run]
omit = [
    "src/core/inference_engine.py",
    "src/services/face_detector.py",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
