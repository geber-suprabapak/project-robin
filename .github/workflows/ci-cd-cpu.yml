name: CI/CD CPU

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/geber-suprabapak/project-robin
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: uv lock, lint, test
    runs-on: ubuntu-latest
    env:
      SKIP_MODEL_LOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Sync CPU dependencies
        run: uv sync --frozen --extra cpu --group dev --python ${{ env.PYTHON_VERSION }}

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=70

  build:
    name: Build and publish CPU image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            RUNTIME_TYPE=cpu
            BASE_IMAGE=python:3.12-slim-bookworm
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:cpu-latest
            ${{ env.IMAGE_NAME }}:cpu-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu
